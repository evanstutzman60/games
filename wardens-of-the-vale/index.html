<script>
// ===LOGIC-START===
const VW = 960, VH = 600, START_LIVES = 20, SELL = 0.6, WAVE_REST = 20;
let PATH = [], SEG = [], PL = 0, SPOTS = [];
function loadMap(m) { PATH = m.path; SPOTS = m.spots; SEG = []; PL = 0;
  for (let i = 0; i + 1 < PATH.length; i++) { const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1], l = Math.hypot(x2 - x1, y2 - y1); if (l < 0.01) continue; SEG.push({ x1, y1, x2, y2, l, s: PL, nx: -(y2 - y1) / l, ny: (x2 - x1) / l }); PL += l; } }
function at(s, off) { s = Math.max(0, Math.min(PL, s)); let g = SEG[SEG.length - 1]; for (const q of SEG) if (s <= q.s + q.l) { g = q; break; }
  const t = (s - g.s) / g.l; return [g.x1 + (g.x2 - g.x1) * t + g.nx * (off || 0), g.y1 + (g.y2 - g.y1) * t + g.ny * (off || 0)]; }
function nearestS(x, y) { let best = { s: 0, d: 1e9 }; for (const g of SEG) { const t = Math.max(0, Math.min(1, ((x - g.x1) * (g.x2 - g.x1) + (y - g.y1) * (g.y2 - g.y1)) / (g.l * g.l)));
  const d = Math.hypot(x - (g.x1 + (g.x2 - g.x1) * t), y - (g.y1 + (g.y2 - g.y1) * t)); if (d < best.d) best = { s: g.s + t * g.l, d }; } return best; }

// armor cuts physical damage, ward cuts magic damage. threat is what a wave pays to field one; tier is the campaign level that introduces it
const FOES = {
  scrap:  { name: 'Scrapling',  hp: 18,  spd: 52,  armor: 0,    ward: 0,   gold: 4,  hit: 3,  lives: 1, r: 8,  col: '#7fae4a', threat: 1,   gap: 0.6, tier: 1 },
  hound:  { name: 'Dire Hound', hp: 28,  spd: 105, armor: 0,    ward: 0,   gold: 6,  hit: 4,  lives: 1, r: 8,  col: '#8a6a4a', threat: 1.8, gap: 0.6, tier: 1 },
  tusker: { name: 'Tusker',     hp: 85,  spd: 34,  armor: 0.5,  ward: 0,   gold: 15, hit: 8,  lives: 1, r: 11, col: '#5d7f3a', threat: 6,   gap: 2.0, tier: 1 },
  gloom:  { name: 'Gloomwing',  hp: 36,  spd: 72,  armor: 0,    ward: 0,   gold: 10, hit: 0,  lives: 1, r: 9,  col: '#4a5670', threat: 3.2, gap: 1.0, tier: 2, fly: true },
  hexer:  { name: 'Hexcaller',  hp: 60,  spd: 44,  armor: 0,    ward: 0.8, gold: 14, hit: 5,  lives: 1, r: 9,  col: '#8a5fb0', threat: 5,   gap: 1.5, tier: 3 },
  iron:   { name: 'Ironhide',   hp: 130, spd: 30,  armor: 0.8,  ward: 0,   gold: 24, hit: 10, lives: 2, r: 12, col: '#8b9198', threat: 12,  gap: 2.4, tier: 4 },
  wisp:   { name: 'Marsh Wisp', hp: 44,  spd: 84,  armor: 0,    ward: 0.6, gold: 12, hit: 0,  lives: 1, r: 8,  col: '#6fd0c0', threat: 4.6, gap: 0.9, tier: 5, fly: true },
  brute:  { name: 'Warbrute',   hp: 380, spd: 26,  armor: 0.65, ward: 0.4, gold: 45, hit: 22, lives: 3, r: 15, col: '#9a4a3a', threat: 30,  gap: 4.0, tier: 6 },
  giant:  { name: 'Hill Giant', hp: 900, spd: 20,  armor: 0.3,  ward: 0.5, gold: 120, hit: 30, lives: 10, r: 19, col: '#a0764d', threat: 70, gap: 6.0, tier: 99, boss: true }
};
const TOWERS = {
  archer: { name: 'Archer Post', desc: 'Fast arrows. Hits flyers. Weak against armor.', cost: [70, 120, 190], dmg: [[4, 7], [8, 13], [11, 17]], rate: [0.8, 0.65, 0.55], range: [140, 160, 180], kind: 'phys', air: true, spec: [
    { name: 'Marksmen', desc: 'Very long range, heavy single shots.', cost: 260, dmg: [38, 58], rate: 1.5, range: 240, abil: [
      { name: 'Bodkin Points', desc: 'Arrows ignore 40% / 80% of armor.', cost: [120, 120] }, { name: 'Killshot', desc: 'Every 10s / 7s: 250 / 450 pure damage to the toughest enemy in range.', cost: [150, 150] }] },
    { name: 'Volley Nest', desc: 'A stream of arrows at medium range.', cost: 260, dmg: [11, 17], rate: 0.24, range: 170, abil: [
      { name: 'Twin Shot', desc: '30% / 60% chance to also hit a second enemy.', cost: [110, 110] }, { name: 'Barbed Arrows', desc: 'Hits slow the target by 20% / 35% for 1.5s.', cost: [100, 100] }] }] },
  mage: { name: 'Mage Spire', desc: 'Slow bolts of magic that ignore armor. Hits flyers. Weak against warded foes and swarms.', cost: [110, 170, 250], dmg: [[11, 19], [26, 40], [50, 72]], rate: [1.8, 1.8, 1.7], range: [130, 145, 160], kind: 'magic', air: true, spec: [
    { name: 'Arcanist', desc: 'One enormous bolt at a time.', cost: 280, dmg: [105, 145], rate: 1.8, range: 175, abil: [

    { name: 'Stormcaller', desc: 'Lightning that jumps to 2 more enemies at 60% strength.', cost: 280, dmg: [42, 60], rate: 1.5, range: 160, chain: 2, abil: [

    { name: 'Rangers\' Lodge', desc: 'Lighter fighters who also throw javelins at anything nearby, flyers included.', cost: 240, hp: 170, sdmg: [12, 18], armor: 0.2, throwR: 115, abil: [
      { name: 'Venom', desc: 'Hits poison for 5 / 10 damage a second over 4s.', cost: [110, 110] }, { name: 'Reserves', desc: 'A fourth ranger joins / and rangers return in 4s.', cost: [130, 130] }] }] }
};
const TREE = {
  archer: { name: 'Archery', t: ['Range +10%', 'Archer towers cost 10% less', 'Damage +15%'] },
  mage:   { name: 'Sorcery', t: ['Damage +10%', 'Bolts slow enemies 15% for 1s', 'Range +10% and 10% faster'] },
  bomb:   { name: 'Engineering', t: ['Blast radius +12%', 'Damage +15%', 'Reload 15% faster'] },
  guard:  { name: 'Soldiery', t: ['Soldier health +20%', 'Soldiers return in 5s instead of 8s', 'Soldier damage +25%, armor +10'] },
  spell:  { name: 'Spellcraft', t: ['Firestorm damage +30%', 'Reinforce: 3 militia for 20s', 'Both spell cooldowns 25% shorter'] }
};
const TIER_COST = [1, 2, 3], TIER_SUM = [0, 1, 3, 6];
const HEROES = {
  knight: { name: 'The Castellan', shape: 'square', role: 'Melee. Blocks the road and soaks damage.', nodes: [['Shield Slam', 'Unlocks the ability: stuns ground enemies around the hero for 2.5s and hurts them.'], ['Iron Will', 'Armor 40 to 55, and heals 3% a second at all times.'], ['Rallying Cry', 'Slam stuns 2s longer and fully heals soldiers nearby.']] },
  ranger: { name: 'The Pathfinder', shape: 'triangle', role: 'Ranged. Fast arrows, hits flyers, cannot be attacked.', nodes: [['Arrow Storm', 'Unlocks the ability: 8 heavy arrows at enemies in range.'], ['Eagle Eye', 'Range +30 and a 20% chance of double damage.'], ['Black Quiver', 'Arrow Storm fires 14 arrows.']] },
  mage:   { name: 'The Starcaller', shape: 'star', role: 'Ranged magic with a small blast. Cannot be attacked.', nodes: [['Frost Nova', 'Unlocks the ability: slows everything nearby by 60% for 4s and hurts it.'], ['Resonance', 'Attack blast radius 30 to 55.'], ['Deep Freeze', 'Nova first freezes enemies solid for 1.5s.']] }
};
const HERO_XP = [0, 35, 90, 170, 280, 420];
const NO_MOD = () => ({ tree: { archer: 0, mage: 0, bomb: 0, guard: 0, spell: 0 }, hero: { knight: 0, ranger: 0, mage: 0 } });

// ---------- level generator ----------
const LEVELS = [   // k is each level's enemy-health scale: between what a plain mixed build survives and what a full kit (spells, early calls, hero) survives, leaning harder in later levels
  { name: 'Greenmeadow', seed: 11, k: 1.39 }, { name: 'Millbrook Ford', seed: 23, k: 1.5 }, { name: 'Thornwood', seed: 37, k: 1.2 }, { name: 'Ashen Pass', seed: 41, k: 1.69 }, { name: 'Marsh of Whispers', seed: 59, k: 1.71 }, { name: 'Stonecrown', seed: 67, k: 1.67 }, { name: 'The Burnt Mile', seed: 71, k: 1.96 }, { name: 'Gates of the Vale', seed: 89, k: 1.65 }
];
function genPath(rng) {
  const C = 8, R = 5, ri = n => (rng() * n) | 0;
  for (let attempt = 0; attempt < 400; attempt++) {
    const want = 11 + ri(7), cells = [[0, ri(R)]], seen = new Set([cells[0].join()]); let steps = 0;
    const ok = (c, r, cur) => c >= 0 && r >= 0 && c < C && r < R && !seen.has(c + ',' + r) && [[1, 0], [-1, 0], [0, 1], [0, -1]].every(([dc, dr]) => { const k = (c + dc) + ',' + (r + dr); return k === cur || !seen.has(k); });
    const walk = () => { const [c, r] = cells[cells.length - 1]; if (c === C - 1 && cells.length >= want) return true; if (cells.length > want + 5 || ++steps > 3000) return false;
      const dirs = [[1, 0], [0, 1], [0, -1], [-1, 0]].map(d => [d, rng() + (d[0] === 1 ? (cells.length >= want - 2 ? 0.6 : -0.15) : d[0] === -1 ? -0.25 : 0.1)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
      for (const [dc, dr] of dirs) { const nc = c + dc, nr = r + dr; if (!ok(nc, nr, c + ',' + r)) continue; cells.push([nc, nr]); seen.add(nc + ',' + nr); if (walk()) return true; seen.delete(nc + ',' + nr); cells.pop(); }
      return false; };
    if (!walk()) continue;
    const pts = cells.map(([c, r]) => [Math.max(64, Math.min(VW - 64, c * 120 + 60 + (rng() - 0.5) * 34)), Math.max(70, Math.min(VH - 62, r * 120 + 60 + (rng() - 0.5) * 34))]);
    const raw = [[-34, pts[0][1]], ...pts, [VW + 34, pts[pts.length - 1][1]]], out = [raw[0]];
    for (let i = 1; i + 1 < raw.length; i++) { const [px, py] = raw[i - 1], [x, y] = raw[i], [nx, ny] = raw[i + 1]; out.push([x + (px - x) * 0.25, y + (py - y) * 0.25], [x + (nx - x) * 0.25, y + (ny - y) * 0.25]); }   // round the corners
    out.push(raw[raw.length - 1]); return out;
  }
  return [[-34, 300], [VW + 34, 300]];
}
function genSpots(n) {
  const cand = [];
  for (let s = 50; s < PL - 40; s += 24) for (const off of [56, -56]) { const [x, y] = at(s, off); if (x < 34 || x > VW - 34 || y < 52 || y > VH - 34) continue; if (nearestS(x, y).d < 47) continue;
    let cover = 0; for (let q = 0; q < PL; q += 12) { const [px, py] = at(q); if (px > 0 && px < VW && Math.hypot(px - x, py - y) <= 140) cover += 12; } cand.push({ x, y, s, cover }); }
  const out = [], far = c => out.every(o => Math.hypot(o.x - c.x, o.y - c.y) >= 66);
  for (let b = 0; b < n; b++) { const lo = PL * b / n, hi = PL * (b + 1) / n; const best = cand.filter(c => c.s >= lo && c.s < hi && far(c)).sort((a, b2) => b2.cover - a.cover)[0]; if (best) out.push(best); }
  for (const c of cand.sort((a, b) => b.cover - a.cover)) { if (out.length >= n) break; if (far(c)) out.push(c); }
  return out.map(c => [Math.round(c.x), Math.round(c.y)]);
}
function genWaves(rng, tier) { const k = 1.3;
  const pool = Object.keys(FOES).filter(t => FOES[t].tier <= tier), n = Math.min(14, 7 + tier), waves = [], ri = m => (rng() * m) | 0;
  const newest = pool.filter(t => FOES[t].tier === tier && tier > 1);
  for (let w = 0; w < n; w++) {
    const budget = k * 11 * (1 + 0.3 * w) * (1 + 0.16 * (tier - 1)), early = w < 2;
    let types = early ? ['scrap'] : []; if (w === 1 && tier >= 1) types = ['scrap', 'hound'].slice(0, 1 + ri(2));
    if (!early) { const opts = pool.filter(t => FOES[t].threat <= budget * 0.5); const m = 1 + ri(3); while (types.length < m && opts.length) { const t = opts.splice(ri(opts.length), 1)[0]; types.push(t); }
      const armored = pool.filter(t => FOES[t].armor >= 0.4 && FOES[t].threat <= budget * 0.6); if (armored.length && !types.some(t => FOES[t].armor >= 0.4) && rng() < (tier >= 4 ? 0.9 : 0.6)) types.push(armored[ri(armored.length)]);
      if (newest.length && (w === 2 || w === n - 2) && !types.includes(newest[0])) types[0] = newest[0]; }
    const groups = []; let delay = 0; const shares = types.map(() => 0.5 + rng()), tot = shares.reduce((a, b) => a + b, 0);
    types.forEach((t, i) => { const F = FOES[t], cnt = Math.max(1, Math.round(budget * shares[i] / tot / F.threat * (F.fly ? 0.6 : F.armor >= 0.4 ? 1.25 : 1))); groups.push([t, cnt, +(F.gap * (0.8 + rng() * 0.4)).toFixed(2), +delay.toFixed(1)]); delay += 2.5 + rng() * 3; });
    if (w === n - 1 && tier >= 3) groups.unshift(['giant', tier >= 7 ? 2 : 1, 8, 0]);
    waves.push(groups);
  }
  return waves;
}
function genLevel(seed, tier, k, name) {
  let rng, path, spots;
  for (let tries = 0; tries < 25; tries++) { rng = mulberry32((seed + tries * 1009) * 7919 + 13); path = genPath(rng); loadMap({ path, spots: [] });
    spots = genSpots(Math.min(16, 11 + (tier >> 1))); loadMap({ path, spots }); if (spots.length >= 10 && PL >= 1400) break; }
  return { name: name || 'Uncharted land', seed, tier, k, path, spots, pl: PL, waves: genWaves(rng, tier), gold: 260 + 15 * tier };   // k scales enemy health for this level
}
const campaignLevel = i => genLevel(LEVELS[i].seed, i + 1, LEVELS[i].k, LEVELS[i].name);

// ---------- game ----------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function newGame(def, mod, opt) {
