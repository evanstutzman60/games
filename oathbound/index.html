<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oathbound</title>
<style>
  :root { --bg: #191613; --panel: #24201b; --panel2: #2e2922; --line: #453d32; --ink: #e9e1d2; --dim: #a39a88; --gold: #d9a441; --red: #c8553d; --green: #6fae6a; --blue: #6c9bd1; --purple: #a583c9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Georgia, 'Times New Roman', serif; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #5a4520; border-color: var(--gold); }
  button.on { outline: 2px solid var(--gold); }
  select, input[type=text] { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  header { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 20px; margin: 0; color: var(--gold); letter-spacing: 1px; }
  header .sp { flex: 1; }
  .stat b { color: var(--gold); }
  #wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 12px; padding: 12px; max-width: 1250px; margin: 0 auto; }
  @media (max-width: 860px) { #wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  h2 { font-size: 19px; margin: 0 0 8px; color: var(--gold); } h3 { font-size: 15px; margin: 10px 0 4px; color: var(--dim); font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
  p { margin: 6px 0; } .dim { color: var(--dim); } .small { font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seat { display: grid; grid-template-columns: 110px 1fr 120px; gap: 8px; margin: 6px 0; }
  .bar { height: 8px; background: #111; border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--green); } .bar.low i { background: var(--red); }
  .hero { margin-bottom: 8px; cursor: pointer; } .hero .nm { display: flex; justify-content: space-between; }
  .mapbox { overflow-x: auto; background: #1e1a16; border: 1px solid var(--line); border-radius: 8px; }
  .node { cursor: default; } .node.go { cursor: pointer; } .node.go circle { stroke: var(--gold); stroke-width: 3; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { stroke-opacity: 0.35; } }
  .side { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 6px 0; }
  .rowline { display: flex; gap: 8px; align-items: stretch; min-height: 74px; }
  .rowlab { width: 54px; font-size: 12px; color: var(--dim); display: flex; align-items: center; justify-content: center; text-align: center; border: 1px dashed var(--line); border-radius: 6px; padding: 2px; }
  .rowlab.tgt { border: 2px solid var(--green); color: var(--ink); cursor: pointer; background: #23331f; }
  .unit { position: relative; flex: 1; max-width: 190px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; cursor: pointer; }
  .unit.cur { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; } .unit.tgt { border-color: var(--green); box-shadow: 0 0 8px var(--green); } .unit.down { opacity: 0.4; }
  .unit .un { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .unit.E .un { color: #e3a393; } .unit.boss .un { color: var(--purple); }
  .chip { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; margin: 2px 2px 0 0; background: #4a3a2a; } .chip.good { background: #2c4a36; } .chip.Burning { background: #7a3a1c; } .chip.Stunned { background: #5d5a1e; } .chip.Marked { background: #6a2540; } .chip.Exposed { background: #44306a; } .chip.Prone { background: #2d4a5e; }
  .pop { position: absolute; right: 6px; top: 2px; font-weight: bold; font-size: 17px; animation: rise 1.1s forwards; pointer-events: none; } .pop.d { color: #ff7a5c; } .pop.h { color: var(--green); } .pop.m { color: var(--dim); font-size: 13px; }
  @keyframes rise { from { opacity: 1; transform: translateY(6px); } to { opacity: 0; transform: translateY(-14px); } }
  .log { height: 118px; overflow-y: auto; background: #151210; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; color: var(--dim); } .log div:last-child { color: var(--ink); }
  .acts button { min-width: 96px; } .acts .cd { color: var(--dim); font-size: 12px; }
  .choice { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; } .choice small { display: block; color: var(--dim); }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--panel2); } .item.sold { opacity: 0.4; } .item b { color: var(--gold); }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 5; } #modal.show { display: flex; } #modal > div { max-width: 640px; width: 100%; }
  .sk { border-top: 1px solid var(--line); padding: 6px 0; } .sk label { display: flex; gap: 8px; align-items: baseline; }
  .dice { display: inline-block; min-width: 34px; text-align: center; border: 2px solid var(--gold); border-radius: 6px; font-size: 20px; padding: 2px 6px; margin-right: 8px; }
</style>
</head>
<body>
<header><h1>OATHBOUND</h1><span id="hud" class="row"></span><span class="sp"></span><label class="small"><input type="checkbox" id="fast"> Fast</label><button id="helpb">Rules</button><button id="newb">New adventure</button></header>
<div id="wrap"><main id="main"></main><aside id="party"></aside></div>
<div id="modal"><div class="card" id="mbody"></div></div>
<script>
// ===LOGIC-START===
// ---------- helpers ----------
function rnd(S) { S.seed = (S.seed + 0x6D2B79F5) | 0; let t = S.seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const ri = (S, n) => Math.floor(rnd(S) * n), pick = (S, a) => a[ri(S, a.length)], die = (S, n) => 1 + ri(S, n);
function shuffle(S, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(S, i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const STATS = ['might', 'agility', 'mind', 'spirit'], STAT_NAME = { might: 'Might', agility: 'Agility', mind: 'Mind', spirit: 'Spirit' };
const K = { hp: 1.25, atk: 0.8, heroHeal: 0.15 };   // global difficulty knobs, set by simulation

const STATE_INFO = {
  Burning: 'Takes fire damage at the start of each of its turns.',
  Stunned: 'Loses its next turn and is easier to hit. Cannot be stunned again straight away.',
  Marked: 'Attacks against it get +3 to hit and +25% damage.',
  Exposed: 'Armour counts as zero and physical hits deal +25%.',
  Prone: 'Melee attacks against it get +4 to hit; it deals half damage on its next turn, then stands.',
  Guard: 'Takes half damage.', Taunt: 'Enemies must attack this target if they can.',
  Blessed: '+2 to hit and +20% damage.', Hidden: 'Cannot be singled out; the next attack is a critical hit.',
  Steady: 'Cannot be stunned.'
};
const DEBUFFS = ['Burning', 'Stunned', 'Marked', 'Exposed', 'Prone'];

// ---------- skills ----------
// ty: melee | ranged | spell | heal | buff     tg: one | row | all | ally | allies | self
// m: damage multiplier, ap: [[state, turns, chance]], pay: { s: [states], m, consume, ap }, cd: cooldown, w: how much the AI likes to keep it equipped
const SK = {
  attack: { n: 'Attack', ty: 'melee', tg: 'one', m: 1 },
  // Warrior
  bash: { n: 'Shield Bash', ty: 'melee', tg: 'one', m: 0.8, ap: [['Stunned', 1, 0.6]], cd: 3, w: 6 },

  purify: { n: 'Purify', ty: 'heal', tg: 'ally', heal: 0.8, cleanse: true, buff: [['Guard', 1]], cd: 2, w: 7 },
  sunburst: { n: 'Sunburst', ty: 'spell', tg: 'all', m: 0.9, holy: true, pay: { s: ['Marked', 'Exposed'], m: 1.5 }, cd: 4, w: 9 },

  judgement: { n: 'Judgement', ty: 'melee', tg: 'one', m: 1.1, holy: true, pay: { s: ['Prone', 'Exposed'], m: 1.6, ap: ['Stunned', 1] }, cd: 3, w: 8 },
  holyfire: { n: 'Holy Fire', ty: 'melee', tg: 'one', m: 1.3, holy: true, ap: [['Burning', 3, 1]], leech: 0.4, cd: 3, w: 9 },
  // enemies
  e_hit: { n: 'Strike', ty: 'melee', tg: 'one', m: 1 },
  e_shot: { n: 'Shot', ty: 'ranged', tg: 'one', m: 1 },

  e_callwolves: { n: 'Call the Pack', ty: 'buff', tg: 'self', summon: 'wolf', k: 2, cd: 4 },

};
for (const k in SK) SK[k].id = k;
const pct = v => Math.round(v * 100) + '%';
function skillDesc(sk) {
  const p = [], tg = { one: 'one enemy', row: 'an enemy row', all: 'all enemies', ally: 'one ally', allies: 'the whole party', self: 'yourself' }[sk.tg];
  if (sk.m) p.push(`${{ melee: 'Melee', ranged: 'Ranged', spell: 'Spell' }[sk.ty]} attack on ${tg} for ${pct(sk.m)} damage${sk.holy ? ' (holy)' : ''}${sk.sure ? ', never misses' : ''}.`);
  if (sk.heal) p.push(`Heals ${tg} (${pct(sk.heal)} strength).`);
  if (sk.healP) p.push(`Restores ${pct(sk.healP)} of your health.`);
  if (sk.cleanse) p.push('Removes harmful states.');
  for (const [s, t, c] of sk.ap || []) p.push(`${c < 1 ? pct(c) + ' chance to apply' : 'Applies'} ${s} (${t} turn${t > 1 ? 's' : ''}).`);
  for (const [s, t] of sk.buff || []) p.push(`Grants ${s} to ${tg} (${t} turn${t > 1 ? 's' : ''}).`);
  if (sk.selfAp) p.push(`Leaves you ${sk.selfAp[0]}.`);
  if (sk.pay) p.push(`Against ${sk.pay.s.length === 5 ? 'any harmful state' : sk.pay.s.join(' or ')}: x${sk.pay.m} damage${sk.pay.ap ? ' and applies ' + sk.pay.ap[0] : ''}${sk.pay.consume ? ' (uses up the state)' : ''}.`);
  if (sk.leech) p.push(`Heals the ${sk.ty === 'melee' && sk.holy ? 'party' : 'user'} for ${pct(sk.leech)} of the damage.`);
  if (sk.summon) p.push('Calls reinforcements.');
  if (sk.once) p.push('Once per fight.'); else if (sk.cd) p.push(`Cooldown ${sk.cd}.`);
  return p.join(' ');
}

// ---------- classes ----------
const CLASSES = {
  warrior: { n: 'Warrior', row: 'F', hp: 30, hpl: 8, st: [4, 2, 1, 2], grow: ['might', 'agility'], wp: ['sword', 'axe', 'mace', 'spear'], shield: true, armor: 3, base: ['bash', 'sunder', 'taunt', 'trip', 'cleave'], start: ['sword', 'shield', 'medium'],

};

// ---------- items ----------
const WT = {

function pickEvent(S, act) {
  const ok = e => !S.q.used.includes(e.id) && !(e.act && !e.act.includes(act)) && e.id !== 'hook' && (!e.req || S.q.flags[e.req]);
  const due = EVENTS.filter(e => e.req && ok(e)), gen = EVENTS.filter(e => !e.req && ok(e));
  const plot = gen.filter(e => e.act); const e = due.length && rnd(S) < 0.7 ? pick(S, due) : plot.length && rnd(S) < 0.45 ? pick(S, plot) : pick(S, gen.length ? gen : EVENTS.filter(x => !x.act && !x.req)); return e.id;
}

  const stat = heroStat(S.party[hi], c.s), need = clamp(baseDC(S, c) - stat, 2, 20); return { hi, stat, need, odds: (21 - need) / 20 }; }

// ---------- map ----------
const NODE = { fight: ['⚔', '#7a3b2e', 'Fight'], elite: ['☠', '#8a2d52', 'Elite fight'], boss: ['♛', '#6b3fa0', 'The lair'], event: ['?', '#3d5f7a', 'Encounter'], shop: ['$', '#7a6520', 'Merchant'], rest: ['☾', '#3c6b45', 'Camp'] };

    h('div', { class: 'un' }, u.name), hpBar(u.hp, u.max), h('div', { class: 'small dim' }, up(u) ? `${u.hp}/${u.max}` : u.side === 'H' ? 'down' : 'dead'),

function describeUnit(C, u) {

        h('button', { disabled: !S.bag.length, class: bagOpen ? 'on' : '', onclick: () => { bagOpen = !bagOpen; sel = null; render(); } }, 'Supplies')),

  } else bar.append(h('p', { class: 'dim' }, cur ? `${cur.name} is acting…` : ''));

  card.append(bar); main.append(card);

const itemCard = (it, foot) => h('div', { class: 'item' + (it.sold ? ' sold' : '') }, h('b', null, it.n + (it.k === 'cons' && it.qty > 1 ? ` x${it.qty}` : '')), h('div', { class: 'small' }, itemDesc(it)), foot);
function renderEvent(main) {

}

    h('div', { class: 'grid3' }, S.shop.items.map((it, k) => itemCard(it, it.sold ? h('div', { class: 'small dim' }, 'Sold') : h('div', null, h('div', { class: 'small' }, `${it.price} gold`), S.gold >= it.price ? giveButtons(it, i => { buy(S, k, i); render(); }) : h('div', { class: 'small dim' }, 'Too expensive'))))),
    h('p', { class: 'row' }, h('button', { disabled: !hurt || S.gold < S.shop.healCost, onclick: () => { buyHeal(S); render(); } }, `Healer: full health and one wound each (${S.shop.healCost} gold)`), h('button', { class: 'primary', onclick: () => { finishNode(S); render(); } }, 'Leave'))));

function rules() {
